<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定宽，观察长与面积</title><style>
*{box-sizing:border-box}body{margin:0;font:18px/1.55 system-ui,sans-serif;background:#eef5f6;color:#163c48}main{max-width:1080px;margin:auto;padding:28px}h1{font-size:clamp(25px,4vw,42px);margin:10px 0}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:25px}section{min-width:0}svg{width:100%;background:#fff;border-radius:12px}label{display:block;margin:15px 0}input[type=range]{width:100%;accent-color:#087f88}button{font:inherit;color:inherit;border:1px solid #b9cfd4;border-radius:8px;background:#fff;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#ccebec;border-color:#087f88}.choices{display:flex;flex-wrap:wrap;gap:8px}.readout{font-size:24px;color:#07666e}.feedback{background:#dceeee;padding:15px;min-height:110px;border-radius:10px}table{border-collapse:collapse;width:100%;margin-top:14px;font-size:15px}th,td{border-bottom:1px solid #bad1d4;padding:5px;text-align:left}.controls{display:flex;gap:10px;flex-wrap:wrap}small{color:#54717a}@media(max-width:700px){.layout{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><main><header><small>预测 · 控制变量 · 观察关系</small><h1>宽保持不变，面积怎样跟着长变化？</h1><p>蓝色长方形的宽固定为3厘米。先预测长从4厘米变成8厘米时的面积，再拖动长，检查图形和图上的点。</p></header>
<div class="layout"><section aria-label="变量与长方形"><div class="choices" aria-label="预测面积变化"><button data-predict="double">面积变为2倍</button><button data-predict="same">面积不变</button><button data-predict="plus3">面积增加3平方厘米</button></div><label>长：<output id="length">4</output>厘米<input id="slider" aria-label="长" type="range" min="1" max="8" step="0.5" value="4"></label>
<svg viewBox="0 0 500 260" role="img" aria-label="当前长方形"><defs><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#cce4e7" fill="none"/></pattern></defs><g transform="translate(60 50)"><rect id="rectangle" width="168" height="126" fill="url(#grid)" stroke="#05818b" stroke-width="3"/><text id="lengthLabel" x="84" y="-18" text-anchor="middle" fill="#15434a">长4厘米</text><text x="-16" y="65" transform="rotate(-90 -16 65)" text-anchor="middle" fill="#15434a">宽3厘米</text></g></svg>
<p class="readout" aria-live="polite">面积：<output id="area">12</output>平方厘米</p><div class="controls"><button id="record">记录当前数据</button><button id="reset">复位</button></div><table><thead><tr><th>长／厘米</th><th>宽／厘米</th><th>面积／平方厘米</th></tr></thead><tbody id="records"></tbody></table></section>
<section aria-label="长与面积的关系图"><svg viewBox="0 0 460 340" role="img" aria-label="长与面积关系图"><path d="M60 28V282H428" fill="none" stroke="#526f7b" stroke-width="2"/><g fill="#355763" font-size="15"><text x="15" y="22">面积／平方厘米</text><text x="310" y="327">长／厘米</text><text x="42" y="288">0</text><text x="142" y="305">2</text><text x="231" y="305">4</text><text x="320" y="305">6</text><text x="409" y="305">8</text><text x="24" y="226">6</text><text x="18" y="161">12</text><text x="18" y="98">18</text><text x="18" y="34">24</text></g><path d="M60 282L416 28" stroke="#6bacb4" stroke-width="3" fill="none"/><g id="dots"></g><path id="guides" stroke="#d28138" stroke-dasharray="5 4" fill="none"/><circle id="point" cx="238" cy="155" r="7" fill="#e58a37"/><text id="pointLabel" x="245" y="145" fill="#8c4b12">(4, 12)</text></svg>
<p class="feedback" role="status"></p><small>图形和记录来自同一个长值，宽始终为3厘米。这里是准确的几何关系演示，不是真实测量数据。</small></section></div>
</main><script>
let length=4,prediction=null,rows=[];const svgNS='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id);function render(){const area=length*3,x=60+length*44.5,y=282-area*(254/24);$('length').textContent=String(length);$('slider').value=String(length);$('area').textContent=String(area);$('rectangle').setAttribute('width',String(length*42));$('lengthLabel').setAttribute('x',String(length*21));$('lengthLabel').textContent='长'+length+'厘米';$('point').setAttribute('cx',String(x));$('point').setAttribute('cy',String(y));$('guides').setAttribute('d','M60 '+y+'H'+x+'V282');$('pointLabel').setAttribute('x',String(Math.min(x+10,352)));$('pointLabel').setAttribute('y',String(Math.max(y-10,18)));$('pointLabel').textContent='('+length+', '+area+')';document.querySelectorAll('[data-predict]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.predict===prediction)));let text='当前长'+length+'厘米，面积'+area+'平方厘米。保持宽不变，拖动长，对照面积和图上的点。';if(prediction&&length===8)text=prediction==='double'?'你的预测得到图形支持：长从4到8，面积从12到24，均变为2倍。宽仍是3厘米。':'当前面积为24，初始为12。它变为2倍，增加了12平方厘米；请对照你原先的预测。';else if(prediction)text+=' 你已给出预测，将长调至8厘米检验它。';$('feedback').textContent=text;const tbody=$('records');tbody.replaceChildren();$('dots').replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const value of [row.length,3,row.area]){const td=document.createElement('td');td.textContent=String(value);tr.append(td)}tbody.append(tr);const dot=document.createElementNS(svgNS,'circle');dot.setAttribute('cx',String(60+row.length*44.5));dot.setAttribute('cy',String(282-row.area*254/24));dot.setAttribute('r','4');dot.setAttribute('fill','#087f88');$('dots').append(dot)}}
// The visible feedback node has no dependency on page-global state outside this local program.
document.querySelector('.feedback').id='feedback';$('slider').addEventListener('input',e=>{length=Number(e.target.value);render()});document.querySelectorAll('[data-predict]').forEach(b=>b.addEventListener('click',()=>{prediction=b.dataset.predict;render()}));$('record').addEventListener('click',()=>{rows.push({length,area:length*3});render()});$('reset').addEventListener('click',()=>{length=4;prediction=null;rows=[];render()});render();
</script></body></html>
