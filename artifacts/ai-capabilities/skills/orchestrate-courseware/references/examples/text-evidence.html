<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在原文中找到时间与依据</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e2;color:#263e39;font:18px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px}header p{color:#64736b}h1{font-size:clamp(25px,4vw,42px);line-height:1.2;margin:12px 0}.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:32px}section{min-width:0}blockquote{margin:0;font-size:26px;line-height:2.25}button{font:inherit;cursor:pointer;border:1px solid #c4d2c4;border-radius:8px;padding:10px 15px;background:#fff8e9;color:#244a3d}blockquote button{border:0;border-bottom:2px solid transparent;padding:0 4px;border-radius:0;background:transparent;font-size:inherit}button[aria-pressed=true]{background:#d6ebd3;border-color:#247346}.timeline{display:flex;justify-content:space-between;gap:5px;border-top:3px solid #8aa99c;margin:28px 0;padding-top:12px}.timeline span{text-align:center;flex:1;color:#778b80}.timeline .active{color:#155d41;font-weight:700}.reading{padding:18px;border-left:4px solid #509478;background:#fffaf0;min-height:120px}.choices{display:grid;gap:8px;margin:12px 0}.feedback{min-height:100px;padding:16px;background:#eaf2df;border-radius:8px}.foot{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:22px;font-size:14px}a{color:#28624a}@media(max-width:700px){main{padding:20px}.layout{grid-template-columns:1fr}blockquote{font-size:22px}}
</style></head><body><main>
<header><p>原文 · 时间 · 判断</p><h1>“三十而立”，意味着学习结束了吗？</h1><p>点选一句原文，看它在时间线上的位置，再判断这段文字能支持什么。</p></header>
<div class="layout"><section aria-label="原文"><blockquote>子曰：<br>
<button data-step="0">吾十有五而志于学</button>，<br><button data-step="1">三十而立</button>，<button data-step="2">四十而不惑</button>，<br><button data-step="3">五十而知天命</button>，<button data-step="4">六十而耳顺</button>，<br><button data-step="5">七十而从心所欲，不逾矩</button>。</blockquote>
<div class="timeline" aria-label="原文年龄顺序"><span>15</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70岁</span></div>
<div class="reading" aria-live="polite"></div></section>
<section aria-label="依据与判断"><h2>我的判断</h2><div class="choices"><button data-claim="stop">原文证明，30岁以后不再学习</button><button data-claim="grow">30岁以后仍写出新的认识阶段</button><button data-claim="everyone">每个人必须在同样年龄达到同样境界</button></div>
<p class="feedback" role="status"></p><p>依据可以支持一部分判断，不能替我们证明原文没有说的事。</p></section></div>
<footer class="foot"><a href="https://ctext.org/text.pl?if=en&node=1121&remap=gb" target="_blank" rel="noopener">原文：《论语·为政》2.4</a><button id="reset">重新取证</button></footer>
</main><script>
const steps=[{age:15,text:'“志于学”写出开始立志学习。'},{age:30,text:'“而立”是一个阶段，单独这一句没有说学习已经结束。'},{age:40,text:'“不惑”出现在30岁之后，可以作为后续认识阶段的直接依据。'},{age:50,text:'“知天命”继续出现在更晚年龄，原文仍描述认识的变化。'},{age:60,text:'“耳顺”是更晚的一个阶段，原文没有给出人人必须如此的规则。'},{age:70,text:'“从心所欲，不逾矩”是这段自述中的最后阶段，不等于所有人的统一年龄标准。'}];
let selected=0,claim=null;const passages=[...document.querySelectorAll('[data-step]')],points=[...document.querySelectorAll('.timeline span')];
function render(){passages.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));points.forEach((p,i)=>p.classList.toggle('active',i===selected));document.querySelector('.reading').textContent=steps[selected].age+'岁 · '+steps[selected].text;document.querySelectorAll('[data-claim]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.claim===claim)));let message='已选中'+steps[selected].age+'岁的句子。选择判断，对照它提供的证据。';if(claim==='grow')message=selected>=2?'这条'+steps[selected].age+'岁的原文直接支持：30岁后仍有新的认识阶段。':'这个判断还需要30岁之后的句子支持。试着选“四十而不惑”或更晚的一句。';if(claim==='stop')message=selected>=2?'当前句子发生在30岁之后，与“以后不再学习”的判断不相符。':'这句没有说明学习结束。还需要看30岁以后写了什么。';if(claim==='everyone')message='这段是孔子的年龄自述。当前句子没有规定每个人必须遵循同样年龄。';document.querySelector('.feedback').textContent=message;}
passages.forEach((b,i)=>b.addEventListener('click',()=>{selected=i;render()}));document.querySelectorAll('[data-claim]').forEach(b=>b.addEventListener('click',()=>{claim=b.dataset.claim;render()}));document.getElementById('reset').addEventListener('click',()=>{selected=0;claim=null;render()});render();
</script></body></html>
