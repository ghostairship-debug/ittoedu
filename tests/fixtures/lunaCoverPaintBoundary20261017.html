</style></head><body><main class="page"><section><div class="eyebrow">校园雨水实验室　/　小学高年级</div><h1 class="title">一场雨，<br>校园为何会积水？</h1><p class="sub">跟着一场<strong>虚构的校园降雨</strong>，观察雨水落到不同地面后的去向，再用可检查的计算提出改造假设。</p><div class="pill"><span>固定校园面积</span><b>100 m²</b><span>· 教学简化模型</span></div><div class="question"><strong>任务问题</strong><br>为什么有的地面容易积水？怎样用证据改造校园？</div></section><figure class="art"><svg viewBox="0 0 560 470" role="img" aria-label="虚构校园雨天剖面：屋顶与道路较硬，草地可让部分雨水入渗"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#163b50"/><stop offset="1" stop-color="#235a66"/></linearGradient><linearGradient id="ground" x2="0" y2="1"><stop stop-color="#39a978"/><stop offset="1" stop-color="#216957"/></linearGradient></defs><rect x="13" y="15" width="534" height="420" rx="32" fill="url(#sky)" stroke="#47808a" stroke-width="2"/><circle cx="446" cy="80" r="40" fill="#f1be69" opacity=".9"/><g fill="#d9ebeb"><ellipse cx="146" cy="100" rx="64" ry="31"/><ellipse cx="195" cy="96" rx="46" ry="39"/><ellipse cx="105" cy="108" rx="38" ry="23"/></g><g stroke="#78d7d0" stroke-width="5" stroke-linecap="round"><path d="M103 146l-13 32M148 149l-13 32M194 147l-13 32M238 133l-12 32M280 130l-12 32"/></g><rect x="46" y="265" width="468" height="127" rx="18" fill="url(#ground)"/><path d="M46 319h468" stroke="#d4c59a" stroke-width="26"/><path d="M46 333h468" stroke="#a49571" stroke-width="4" stroke-dasharray="12 10"/><!-- school --> <rect x="84" y="190" width="182" height="122" rx="7" fill="#f1ca83" stroke="#955d3c" stroke-width="5"/><path d="M67 199l108-70 108 70z" fill="#c66e57" stroke="#7d463c" stroke-width="5"/><rect x="148" y="246" width="48" height="66" fill="#6a7780"/><g fill="#9fd7d7" stroke="#58737b" stroke-width="3"><rect x="103" y="215" width="31" height="28"/><rect x="213" y="215" width="31" height="28"/></g><rect x="320" y="238" width="146" height="35" rx="6" fill="#96a7ad"/><path d="M310 238l83-48 83 48z" fill="#607984"/><g fill="#74bd86"><circle cx="359" cy="293" r="28"/><circle cx="430" cy="295" r="34"/></g><rect x="351" y="300" width="15" height="34" fill="#775a42"/><rect x="423" y="304" width="16" height="34" fill="#775a42"/><path d="M299 345q30-16 56 0t60 0t56 0" fill="none" stroke="#7ed7ce" stroke-width="7" stroke-linecap="round"/><text x="77" y="372" fill="#f8ffff" font-size="15" font-weight="700">硬化地面</text><text x="382" y="372" fill="#f8ffff" font-size="15" font-weight="700">绿地入渗</text><g fill="#f4c263"><circle cx="66" cy="260" r="7"/><circle cx="490" cy="260" r="7"/><circle cx="286" cy="270" r="7"/></g><text x="280" y="414" text-anchor="middle" fill="#c2e7df" font-size="16">雨落校园 → 流过地面 / 进入土壤</text></svg><figcaption class="caption">故事场景为教学设想，不是实际校园观测照片。</figcaption></figure></main></body></html>
