<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%}
*{box-sizing:border-box}
#stage{width:100%;height:100%;padding:16px;display:grid;grid-template-rows:auto 1fr auto;background:#edf6ff;color:#17324d;font:18px sans-serif}
#vw{width:50vw;height:20vh;background:#a6d5ff}
button{font:inherit;padding:8px 16px}output{display:block;min-height:28px}
</style></head><body><section id="stage"><div>局部响应式实验</div><div id="vw">半个局部视口宽</div><footer><button id="run">运行</button><output id="feedback">等待运行</output></footer></section>
<script>document.getElementById('run').onclick=()=>{document.getElementById('feedback').textContent='运行完成，反馈可见'}</script>
</body></html>
