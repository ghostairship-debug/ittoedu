<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>IttoEdu · Agent 形态 · 聚焦布局</title>
<style>
  :root{
    --bg-app:#101014; --bg-panel:#16161b; --bg-elevated:#1e1e24; --bg-hover:#26262e;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.12);
    --t1:#ececf1; --t2:#a1a1ab; --t3:#63636d;
    --blue:#5e8cff; --blue-grad:linear-gradient(180deg,#6b97ff,#4f7ef7);
    --teal:#38c496; --teal-grad:linear-gradient(180deg,#42d4a4,#2cb487);
    --teal-soft:rgba(56,196,150,.10);
    --danger:#e5635f; --warning:#e0a23f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1600px;height:1000px;overflow:hidden;}
  body{background:var(--bg-app);color:var(--t1);
    font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;
    display:flex;flex-direction:column;}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .grp-label{font-size:11px;color:var(--t3);letter-spacing:.08em;}

  /* 顶栏 */
  .topbar{height:48px;background:var(--bg-panel);border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 14px;gap:14px;flex:none;position:relative;z-index:5;}
  .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;}
  .seg{display:flex;background:var(--bg-app);border:1px solid var(--border);border-radius:999px;padding:2px;height:28px;}
  .seg button{border:none;background:transparent;color:var(--t2);font-size:12px;border-radius:6px;padding:0 14px;display:flex;align-items:center;gap:5px;}
  .seg button.on{background:var(--bg-hover);color:var(--t1);font-weight:600;
    box-shadow:inset 0 0 0 1px var(--border-strong),0 1px 3px rgba(0,0,0,.4);}
  .iconbtn{width:26px;height:26px;border-radius:7px;border:none;background:transparent;color:var(--t2);display:flex;align-items:center;justify-content:center;}
  .iconbtn.dis{color:#3f3f49;}
  .docname{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .docname .sub{font-size:11px;color:var(--t3);font-weight:400;display:flex;align-items:center;gap:4px;}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .btn{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:500;
    display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:transparent;color:var(--t2);}
  .avatar{width:26px;height:26px;border-radius:50%;background:#2c2c36;color:#c9c9d4;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;}
  .vdiv{width:1px;height:20px;background:var(--border);}

  .main{flex:1;display:flex;min-height:0;}

  /* 左缘场景栏 104px（常驻） */
  .rail-scenes{width:104px;flex:none;background:var(--bg-panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:10px;}
  .sthumb{width:80px;flex:none;position:relative;}
  .sthumb .th{width:80px;height:45px;border-radius:6px;border:1.5px solid var(--border);background:#fff;overflow:hidden;}
  .sthumb .no{position:absolute;top:-6px;left:-5px;width:16px;height:16px;border-radius:50%;background:var(--bg-hover);
    border:1px solid var(--border-strong);color:var(--t2);font-size:9.5px;display:flex;align-items:center;justify-content:center;z-index:2;}
  .sthumb.cur .th{border-color:var(--blue);box-shadow:0 0 0 3px rgba(94,140,255,.15);}
  .sthumb.cur::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--blue);}
  .sthumb .aiplus{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;
    background:var(--teal-grad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 5px rgba(0,0,0,.4);z-index:2;}
  .sthumb .nm{margin-top:5px;font-size:10px;color:var(--t3);text-align:center;}
  .sthumb.cur .nm{color:var(--t1);font-weight:600;}

  /* 画布舞台（最暗） */
  .stage{flex:1;background:var(--bg-app);position:relative;display:flex;align-items:flex-start;justify-content:center;min-width:0;padding-top:26px;}
  .slide-box{position:relative;width:1336px;height:752px;flex:none;border-radius:4px;
    border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 32px rgba(0,0,0,.5);}
  .slide-box>svg{display:block;width:1336px;height:752px;border-radius:3px;}
  .sel-box{position:absolute;left:5%;top:7.8%;width:22.5%;height:8.9%;border:1.5px solid var(--blue);border-radius:2px;
    box-shadow:0 0 0 4px rgba(94,140,255,.12);}
  .hd{position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--blue);border-radius:2px;transform:translate(-50%,-50%);}

  /* 情境工具条（选中才出现）：选区正上方，毛玻璃胶囊 */
  .ctxbar{position:absolute;left:5%;top:calc(7.8% - 46px);height:36px;display:flex;align-items:center;gap:2px;
    background:rgba(30,30,36,.88);backdrop-filter:blur(20px);border:1px solid var(--border-strong);
    border-radius:999px;padding:0 6px;box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .ctxbar .ci{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;color:var(--t1);}
  .ctxbar .ci.ai{color:#5fdcb2;font-weight:600;background:var(--teal-soft);}
  .ctxbar .csep{width:1px;height:16px;background:var(--border-strong);margin:0 3px;}

  /* 呈现步骤步进器：画布底部中央悬浮胶囊 */
  .stepper-fab{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;height:40px;
    display:flex;align-items:center;gap:2px;
    background:rgba(30,30,36,.88);backdrop-filter:blur(20px);border:1px solid var(--border-strong);
    border-radius:999px;padding:0 6px;box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .stepper-fab .nav{width:28px;height:28px;border:none;border-radius:50%;background:transparent;color:var(--t2);font-size:15px;display:flex;align-items:center;justify-content:center;}
  .stepper-fab .st{height:28px;padding:0 14px;border:none;border-radius:999px;background:transparent;color:var(--t2);font-size:12.5px;display:flex;align-items:center;}
  .stepper-fab .st.on{background:var(--blue-grad);color:#fff;font-weight:600;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 3px rgba(0,0,0,.35);}
  .stepper-fab .ssep{width:1px;height:14px;background:var(--border-strong);}

  /* Dock 上方半浮出候选卡 */
  .peek{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;width:460px;
    background:rgba(30,30,36,.88);backdrop-filter:blur(20px);
    border:1px solid rgba(56,196,150,.4);border-bottom:none;
    border-radius:12px 12px 0 0;padding:10px 14px 18px;
    box-shadow:0 -6px 20px rgba(0,0,0,.35);z-index:7;}
  .peek .r1{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#5fdcb2;}
  .peek .r2{margin-top:4px;font-size:11.5px;color:var(--t2);}
  .peek .go{margin-left:auto;font-size:11px;color:#5fdcb2;border:1px solid rgba(56,196,150,.45);border-radius:999px;padding:2px 9px;flex:none;}

  /* 对话 Dock 64px 收起态 */
  .dock{height:64px;flex:none;background:var(--bg-panel);border-top:1px solid var(--border);position:relative;
    display:flex;align-items:center;padding:0 16px;gap:10px;z-index:6;}
  .dock::before{content:"";position:absolute;top:-2px;left:0;right:0;height:2px;background:var(--teal);
    animation:breath 1.2s ease-in-out infinite;}
  @keyframes breath{0%,100%{opacity:1;}50%{opacity:.25;}}
  .dock .expand{position:absolute;top:-14px;right:20px;width:44px;height:15px;background:var(--bg-panel);
    border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;color:var(--t2);}
  .chip{height:24px;display:flex;align-items:center;gap:5px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:0 10px;font-size:12px;color:var(--t2);flex:none;}
  .chip.sel-el{border-color:rgba(94,140,255,.5);color:var(--t1);}
  .dock-input{flex:1;height:38px;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;
    display:flex;align-items:center;gap:10px;padding:0 8px 0 6px;}
  .plus{width:26px;height:26px;flex:none;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:15px;}
  .ph{flex:1;color:var(--t3);font-size:13px;}
  .send{width:26px;height:26px;border-radius:50%;background:var(--teal-grad);border:none;display:flex;align-items:center;justify-content:center;flex:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 3px rgba(0,0,0,.35);}
  .dock .hist{font-size:11.5px;color:var(--t3);display:flex;align-items:center;gap:6px;flex:none;}
</style>
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b97ff"/><stop offset="1" stop-color="#4f7ef7"/></linearGradient></defs><rect width="22" height="22" rx="6" fill="url(#lg)"/><path d="M7 6v10M15 6v10M7 11h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    IttoEdu
  </div>
  <div class="seg" style="width:140px;">
    <button style="flex:1;">编辑器</button>
    <button class="on" style="flex:1;">Agent</button>
  </div>
  <div class="vdiv"></div>
  <button class="iconbtn" title="撤销"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6a3.5 3.5 0 0 1 0 7H6"/><path d="M5.5 3.5 3 6l2.5 2.5"/></svg></button>
  <button class="iconbtn dis" title="重做"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6H7a3.5 3.5 0 0 0 0 7h3"/><path d="M10.5 3.5 13 6l-2.5 2.5"/></svg></button>
  <div class="docname">光的折射
    <span class="sub">课例 · 最近课例<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4 5 6.5 7.5 4"/></svg></span>
  </div>
  <div class="top-right">
    <div class="seg">
      <button><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1.5" width="12" height="11" rx="1.5"/><path d="M5.5 1.5v11M9.5 1.5v11"/></svg>工作台</button>
      <button class="on"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1.5" width="12" height="8" rx="1.5"/><path d="M3 12.5h8"/></svg>聚焦</button>
    </div>
    <div class="vdiv"></div>
    <button class="btn"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="13" height="9" rx="1.5"/><path d="M6 14h4" stroke-linecap="round"/></svg>预览</button>
    <button class="btn">导出<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4 5 6.5 7.5 4"/></svg></button>
    <div class="vdiv"></div>
    <div class="avatar">李</div>
  </div>
</header>

<div class="main">

  <!-- 左缘场景栏 104px -->
  <nav class="rail-scenes">
    <span class="grp-label" style="align-self:flex-start;padding-left:12px;">场景</span>
    <div class="sthumb">
      <span class="no num">1</span>
      <div class="th"><svg viewBox="0 0 1280 720" width="80" height="45"><rect width="1280" height="720" fill="#fff"/><text x="80" y="120" font-size="46" font-weight="700" fill="#17181d">水中的筷子</text><path d="M500 260 L530 480 L760 480 L790 260 Z" fill="#f0f7fd" stroke="#b9c4d2" stroke-width="6"/><path d="M520 340 L530 480 L760 480 L770 340 Z" fill="#cfe6f8"/><line x1="730" y1="230" x2="668" y2="340" stroke="#b58445" stroke-width="16" stroke-linecap="round"/><line x1="668" y1="340" x2="610" y2="470" stroke="#b58445" stroke-width="16" stroke-linecap="round"/></svg></div>
      <div class="nm">观察筷子</div>
    </div>
    <div class="sthumb cur">
      <span class="no num">2</span>
      <div class="th"><svg viewBox="0 0 1280 720" width="80" height="45"><rect width="1280" height="720" fill="#fff"/><text x="80" y="104" font-size="40" font-weight="700" fill="#17181d">光的折射现象</text><g transform="translate(400 410) rotate(-8)"><rect x="-300" y="0" width="600" height="205" fill="#dcecfb"/><line x1="-300" y1="0" x2="300" y2="0" stroke="#8a93a3" stroke-width="3"/><line x1="-122" y1="-122" x2="0" y2="0" stroke="#e8833a" stroke-width="5"/><line x1="0" y1="0" x2="75" y2="121" stroke="#d9480f" stroke-width="5"/></g><rect x="820" y="120" width="380" height="240" rx="10" fill="#f4f6f9" stroke="#dfe3ea"/></svg></div>
      <div class="nm">折射现象</div>
    </div>
    <div class="sthumb">
      <span class="no num">3</span>
      <span class="aiplus">＋</span>
      <div class="th"><svg viewBox="0 0 1280 720" width="80" height="45"><rect width="1280" height="720" fill="#fff"/><text x="80" y="120" font-size="46" font-weight="700" fill="#17181d">小结</text><rect x="80" y="200" width="600" height="24" rx="4" fill="#e8ebf1"/><rect x="80" y="260" width="520" height="24" rx="4" fill="#e8ebf1"/><rect x="80" y="320" width="560" height="24" rx="4" fill="#e8ebf1"/></svg></div>
      <div class="nm">小结</div>
    </div>
    <div class="sthumb">
      <span class="no num">4</span>
      <div class="th"><svg viewBox="0 0 1280 720" width="80" height="45"><rect width="1280" height="720" fill="#fff"/><text x="80" y="120" font-size="46" font-weight="700" fill="#17181d">练习</text><rect x="80" y="200" width="460" height="130" rx="10" fill="#f4f6f9" stroke="#dfe3ea"/><rect x="80" y="370" width="460" height="130" rx="10" fill="#f4f6f9" stroke="#dfe3ea"/></svg></div>
      <div class="nm">练习</div>
    </div>
  </nav>

  <!-- 画布舞台 -->
  <section class="stage">
    <div class="slide-box">
      <svg viewBox="0 0 1280 720">
        <defs>
          <marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8833a"/></marker>
          <marker id="arD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9480f"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#ffffff"/>
        <text x="1200" y="52" text-anchor="end" font-size="13" fill="#b6bcc7" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">场景 2 / 3</text>
        <text x="80" y="104" font-size="40" font-weight="700" fill="#17181d" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">光的折射现象</text>
        <text x="80" y="150" font-size="18" fill="#5a6270" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">想一想：光从空气斜射入水中，传播方向会怎样变化？</text>
        <g transform="translate(400 410) rotate(-8)">
          <rect x="-300" y="0" width="600" height="205" fill="#dcecfb"/>
          <path d="M-280 46 q12 -9 24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#a9cdec" stroke-width="2" stroke-linecap="round"/>
          <path d="M-260 100 q12 -9 24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#a9cdec" stroke-width="2" stroke-linecap="round"/>
          <path d="M-230 154 q12 -9 24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#a9cdec" stroke-width="2" stroke-linecap="round"/>
          <text x="-272" y="-22" font-size="16" fill="#8a93a3" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">空气</text>
          <text x="238" y="186" font-size="16" fill="#4a86c5" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">水</text>
          <line x1="-300" y1="0" x2="300" y2="0" stroke="#8a93a3" stroke-width="2.5"/>
          <line x1="0" y1="-165" x2="0" y2="165" stroke="#9aa1ae" stroke-width="1.5" stroke-dasharray="7 6"/>
          <text x="8" y="-152" font-size="13" fill="#9aa1ae" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">法线</text>
          <line x1="0" y1="0" x2="82" y2="82" stroke="#c7ccd6" stroke-width="2" stroke-dasharray="6 6"/>
          <line x1="-122" y1="-122" x2="-4" y2="-4" stroke="#e8833a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arO)"/>
          <text x="-196" y="-126" font-size="14" fill="#e8833a" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">入射光线</text>
          <line x1="0" y1="0" x2="75" y2="121" stroke="#d9480f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arD)"/>
          <text x="96" y="140" font-size="14" fill="#d9480f" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">折射光线</text>
          <path d="M 0 -55 A 55 55 0 0 0 -38.9 -38.9" fill="none" stroke="#e8833a" stroke-width="1.8"/>
          <path d="M 0 70 A 70 70 0 0 0 37.1 59.4" fill="none" stroke="#d9480f" stroke-width="1.8"/>
          <text x="-18" y="-72" font-size="15" fill="#e8833a" text-anchor="end" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">入射角 i</text>
          <text x="-14" y="100" font-size="15" fill="#d9480f" text-anchor="end" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">折射角 r</text>
        </g>
        <rect x="820" y="120" width="380" height="240" rx="10" fill="#f4f6f9" stroke="#dfe3ea"/>
        <text x="848" y="164" font-size="19" font-weight="700" fill="#17181d" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">观察与思考</text>
        <circle cx="855" cy="202" r="3" fill="#8a93a3"/><text x="868" y="208" font-size="16" fill="#3a4150" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">入射光线与折射光线，分居法线两侧吗？</text>
        <circle cx="855" cy="250" r="3" fill="#8a93a3"/><text x="868" y="256" font-size="16" fill="#3a4150" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">折射角与入射角，哪个更大？</text>
        <circle cx="855" cy="298" r="3" fill="#8a93a3"/><text x="868" y="304" font-size="16" fill="#3a4150" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">光垂直入射水面时，方向会改变吗？</text>
        <text x="848" y="342" font-size="13" fill="#9aa1ae" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">先猜想，再用激光笔实验验证。</text>
        <text x="830" y="408" font-size="15" font-weight="600" fill="#3a4150" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">导入回顾：水中的筷子</text>
        <path d="M850 424 L866 566 L986 566 L1002 424 Z" fill="#f0f7fd" stroke="#b9c4d2" stroke-width="2"/>
        <path d="M856 474 L866 566 L986 566 L996 474 Z" fill="#cfe6f8"/>
        <line x1="856" y1="474" x2="996" y2="474" stroke="#8fc3ea" stroke-width="2"/>
        <line x1="964" y1="414" x2="936" y2="474" stroke="#b58445" stroke-width="7" stroke-linecap="round"/>
        <line x1="936" y1="474" x2="908" y2="560" stroke="#b58445" stroke-width="7" stroke-linecap="round"/>
        <text x="1024" y="500" font-size="14" fill="#5a6270" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">看起来「弯折」了</text>
        <text x="1024" y="524" font-size="12" fill="#9aa1ae" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">—— 这就是折射</text>
        <text x="80" y="668" font-size="14" fill="#9aa1ae" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif">← 点击「下一步」，逐步揭示折射光路与角度标注</text>
      </svg>
      <!-- 选中框 + 手柄 -->
      <div class="sel-box">
        <i class="hd" style="left:0;top:0;"></i><i class="hd" style="left:50%;top:0;"></i><i class="hd" style="left:100%;top:0;"></i>
        <i class="hd" style="left:0;top:50%;"></i><i class="hd" style="left:100%;top:50%;"></i>
        <i class="hd" style="left:0;top:100%;"></i><i class="hd" style="left:50%;top:100%;"></i><i class="hd" style="left:100%;top:100%;"></i>
      </div>
      <!-- 情境工具条：选中才出现 -->
      <div class="ctxbar">
        <div class="ci"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M8 4v9M5.5 13h5"/></svg>改文字</div>
        <span class="csep"></span>
        <div class="ci ai"><svg width="13" height="13" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M9 1.8 10.8 6.2 15.2 8 10.8 9.8 9 14.2 7.2 9.8 2.8 8 7.2 6.2Z"/></svg>让 AI 改这里</div>
        <span class="csep"></span>
        <div class="ci"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>复制</div>
        <div class="ci"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h12M6 4V2.5h4V4M4 4l.7 9.5A1.5 1.5 0 0 0 6.2 15h3.6a1.5 1.5 0 0 0 1.5-1.5L12 4"/></svg>删除</div>
        <span class="csep"></span>
        <div class="ci" style="padding:0 7px;"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg></div>
      </div>
    </div>

    <!-- 呈现步骤步进器（悬浮胶囊） -->
    <div class="stepper-fab">
      <button class="nav">‹</button>
      <span class="ssep"></span>
      <button class="st">基础</button>
      <span class="ssep"></span>
      <button class="st">揭示光路</button>
      <span class="ssep"></span>
      <button class="st on">标注入射角</button>
      <span class="ssep"></span>
      <button class="nav">›</button>
    </div>
  </section>
</div>

<!-- Dock 上方半浮出候选卡 -->
<div class="peek" style="position:absolute;left:50%;bottom:64px;">
  <div class="r1">
    <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M9 1.8 10.8 6.2 15.2 8 10.8 9.8 9 14.2 7.2 9.8 2.8 8 7.2 6.2Z"/></svg>
    候选改动
    <span class="go">查看</span>
  </div>
  <div class="r2">有 1 条候选改动待查看 · 演示页 1 · 场景 2：修改 1 个元素</div>
</div>

<!-- 对话 Dock 收起态 64px -->
<footer class="dock">
  <div class="expand" title="展开消息区"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 7 4.5l4 4"/></svg></div>
  <span class="hist"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3h11v8h-7l-4 3z"/></svg>12 条消息</span>
  <span class="chip"><svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="11" height="8.5" rx="1.2"/></svg>当前页：场景 2</span>
  <span class="chip sel-el"><svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="#5e8cff" stroke-width="1.4"><rect x="2" y="2" width="10" height="10" rx="1.5"/></svg>标题文本「光的折射现象」</span>
  <div class="dock-input">
    <button class="plus">＋</button>
    <div class="ph">继续描述要改哪里，或展开 Dock 查看候选…</div>
    <button class="send"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
  </div>
</footer>

</body>
</html>
