appId: com.ittoedu.courseware-editor
productName: 果铃工作台
asar: true
asarUnpack:
  - "**/*.node"
  # sharp's Win64 native module loads these adjacent libvips DLLs through the OS loader.
  - "**/node_modules/@img/sharp-win32-x64/lib/*.dll"
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  - dist-player/**
  - resources/icons/icon.png
  - resources/icons/icon.ico
  # Built-in catalog, packages and thumbnails are application resources.
  # Authoring sources, build tools and historical evidence stay in the repository.
  - resources/built-in-components/catalog.json
  - resources/built-in-components/packages/*.h5component
  - resources/built-in-components/components/**/thumbnail.svg
  - package.json
extraResources:
  - from: resources/mcp-bootstrap
    to: mcp-bootstrap
  - from: resources/file-publish/file-publish.exe
    to: file-publish/file-publish.exe
  - from: resources/clipboard-file-list/clipboard-file-list.exe
    to: clipboard-file-list/clipboard-file-list.exe
win:
  icon: resources/icons/icon.ico
  executableName: guoling-workbench
  target:
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64
  requestedExecutionLevel: asInvoker
portable:
  artifactName: guoling-workbench-portable-${version}.${ext}
artifactName: guoling-workbench-${version}-${arch}.${ext}
npmRebuild: false
publish: null
