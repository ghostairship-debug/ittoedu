appId: com.ittoedu.courseware-editor
productName: 果铃工作台
asar: true
asarUnpack:
  - "**/*.node"
  # sharp's Win64 native module loads these adjacent libvips DLLs through the OS loader.
  - "**/node_modules/@img/sharp-win32-x64/lib/*.dll"
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  # Export player code is embedded by the renderer build; do not ship it twice.
  - "!**/*.map"
  - "!dist-renderer/vendor/compute-runtime/**"
  - "!dist-electron/main/workbench/compute/PyodideComputeBackend.js"
  - "!dist-electron/preload/compute.js"
  - resources/icons/icon.png
  - resources/icons/icon.ico
  # Built-in catalog, packages and thumbnails are application resources.
  # Authoring sources, build tools and historical evidence stay in the repository.
  - resources/built-in-components/catalog.json
  - resources/built-in-components/packages/*.h5component
  - resources/built-in-components/components/**/thumbnail.svg
  - package.json
extraResources:
  # Preserve the real relative links; include useful references, not the development archive.
  - from: .
    to: reference-library
    filter:
      - creative-reference/README.md
      - docs/creative-production/works/coffee-journey/runtime-first-system-20261025/METHOD.md
      - docs/creative-production/works/coffee-journey/runtime-first-system-20261025/ASSET_INDEX.md
      - docs/creative-production/works/coffee-journey/runtime-first-system-20261025/FEEDBACK.md
      - docs/creative-production/works/coffee-journey/runtime-first-system-20261025/assets/continuous-background/*
      - docs/creative-production/works/coffee-journey/design/v08-runtime-first/final-20261025/README.md
      - docs/creative-production/works/coffee-journey/design/v08-runtime-first/final-20261025/coffee-journey-v08-runtime-first-final.glx
      - docs/creative-production/works/coffee-journey/design/v08-runtime-first/final-20261025/coffee-journey-v08-runtime-first-final.html
      - docs/creative-production/works/coffee-journey/design/v08-runtime-first/final-20261025/DELIVERY_MANIFEST.json
      - docs/development-plan/20261028-productivity-acp/RESULT.md
      - docs/development-plan/20261026-product-execution/RESULT.md
  - from: resources/mcp-bootstrap
    to: mcp-bootstrap
  - from: resources/office-extractor/win-x64
    to: office-extractor/win-x64
    filter:
      - 7z.exe
      - 7z.dll
      - License.txt
      - readme.txt
      - release.json
  - from: resources/file-publish/file-publish.exe
    to: file-publish/file-publish.exe
  - from: resources/clipboard-file-list/clipboard-file-list.exe
    to: clipboard-file-list/clipboard-file-list.exe
win:
  icon: resources/icons/icon.ico
  executableName: guoling-workbench
  target:
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64
  requestedExecutionLevel: asInvoker
portable:
  artifactName: guoling-workbench-portable-${version}.${ext}
  # In electron-builder 26.15.3, true omits UNPACK_DIR_NAME and uses each launch's $PLUGINSDIR/app.
  # The upstream option comment says false, but NsisTarget.buildInstaller implements the opposite.
  unpackDirName: true
artifactName: guoling-workbench-${version}-${arch}.${ext}
npmRebuild: false
publish: null
