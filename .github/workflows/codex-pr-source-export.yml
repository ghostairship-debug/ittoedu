name: Codex PR Source Export

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Prepare source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/ittoedu
          rsync -a \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'dist-electron/' \
            --exclude 'dist-player/' \
            --exclude 'release/' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            ./ export/ittoedu/
          rm -f export/ittoedu/.github/workflows/codex-source-export.yml
          rm -f export/ittoedu/.github/workflows/codex-pr-source-export.yml
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > export/ittoedu/SOURCE_SNAPSHOT_COMMIT.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ittoedu-source-snapshot
          path: export/ittoedu
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  export-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Record dependency size
        run: du -sh node_modules
      - name: Upload node_modules snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ittoedu-node-modules-linux
          path: node_modules
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
