name: Scoped Validation

# Candidate code must not receive a repository write/admin credential.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: scoped-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      contracts: ${{ steps.scope.outputs.contracts }}
      product_tests: ${{ steps.scope.outputs.product_tests }}
      product_full: ${{ steps.scope.outputs.product_full }}
      governance_tests: ${{ steps.scope.outputs.governance_tests }}
      task_board_check: ${{ steps.scope.outputs.task_board_check }}
      capability_check: ${{ steps.scope.outputs.capability_check }}
      renderer_fonts: ${{ steps.scope.outputs.renderer_fonts }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            head="$PR_HEAD_SHA"
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$base" "$head")"
          fi

          code=false
          contracts=false
          product_tests=false
          product_full=false
          governance_tests=false
          task_board_check=false
          capability_check=false
          renderer_fonts=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              src/*|tests/*|scripts/*|package.json|package-lock.json|tsconfig*.json|vite*.ts|vitest.config.ts|playwright.config.ts)
                code=true
                ;;
            esac
            case "$file" in
              src/shared/contracts/*|docs/contracts/*|artifacts/contracts/*|scripts/generate-contracts.ts|package.json|package-lock.json)
                contracts=true
                ;;
            esac
            case "$file" in
              package.json|package-lock.json|tsconfig*.json|vitest.config.ts|tests/setup.ts)
                product_tests=true
                product_full=true
                governance_tests=true
                ;;
              scripts/generate-task-board.ts|tests/unit/taskBoardGenerator.test.ts)
                governance_tests=true
                ;;
              scripts/generate-ai-capabilities.ts|tests/unit/aiCapabilities.test.ts)
                ;;
              scripts/generate-contracts.ts)
                ;;
              tests/e2e/*|playwright.config.ts|vite*.ts)
                ;;
              src/*|tests/*|scripts/*)
                product_tests=true
                if ! git cat-file -e "$head:$file" 2>/dev/null; then
                  product_full=true
                fi
                ;;
              .github/workflows/check-contracts.yml|vendor/fonts/*/LICENSE)
                product_tests=true
                ;;
            esac
            case "$file" in
              docs/development-plan/TASK_BOARD.md|docs/development-plan/tasks/*/*.md|scripts/generate-task-board.ts|tests/unit/taskBoardGenerator.test.ts)
                task_board_check=true
                ;;
            esac
            case "$file" in
              artifacts/ai-capabilities/*|scripts/generate-ai-capabilities.ts|tests/unit/aiCapabilities.test.ts|scripts/validate-project.ts|package.json|package-lock.json|src/shared/*|src/player/*|src/renderer/components/*|src/renderer/export/*|src/renderer/project/*)
                capability_check=true
                ;;
            esac
            # Own case: `vite*.ts` is swallowed by the product-test case above, and
            # the one line keeping font slices out of `data:` URIs lives there. No
            # Vitest suite runs a renderer build, so nothing else sees it break.
            # This workflow is in the list because the gate's first version never
            # ran: the flag reached `$GITHUB_OUTPUT` but was missing from the job's
            # `outputs:` map, so the condition read an empty string and skipped.
            case "$file" in
              vite*.ts|src/shared/fonts/*|scripts/check-renderer-font-assets.ts|package.json|package-lock.json|.github/workflows/check-contracts.yml)
                renderer_fonts=true
                ;;
            esac
          done <<< "$changed"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "product_tests=$product_tests" >> "$GITHUB_OUTPUT"
          echo "product_full=$product_full" >> "$GITHUB_OUTPUT"
          echo "governance_tests=$governance_tests" >> "$GITHUB_OUTPUT"
          echo "task_board_check=$task_board_check" >> "$GITHUB_OUTPUT"
          echo "capability_check=$capability_check" >> "$GITHUB_OUTPUT"
          echo "renderer_fonts=$renderer_fonts" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"

  development-index:
    needs: changes
    if: needs.changes.outputs.task_board_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:task-board

  check-contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:contracts

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  # The only gate that runs a renderer build. Deliberately narrow: it exists so a
  # reintroduced `assetsInlineLimit` regression cannot ship green, not to move the
  # Electron font E2E into every commit.
  renderer-fonts:
    needs: changes
    if: needs.changes.outputs.renderer_fonts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:renderer-fonts

  test:
    needs: changes
    if: needs.changes.outputs.product_tests == 'true' || needs.changes.outputs.governance_tests == 'true' || needs.changes.outputs.capability_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Install browsers for product tests
        if: needs.changes.outputs.product_tests == 'true'
        run: npx playwright install --with-deps chromium msedge
      - name: Prepare Electron sandbox for real compute tests
        if: needs.changes.outputs.product_tests == 'true'
        shell: bash
        run: |
          sandbox="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$sandbox"
          test ! -L "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - run: npm run build:player
        if: needs.changes.outputs.product_tests == 'true'
      - run: npm run build:renderer
        if: needs.changes.outputs.product_tests == 'true'
      - run: npm run build:electron
        if: needs.changes.outputs.product_tests == 'true'
      # Both paths use the prepared Player, Renderer and Electron artifacts.
      - run: xvfb-run --auto-servernum npm run test:product
        if: needs.changes.outputs.product_tests == 'true' && needs.changes.outputs.product_full == 'true'
      - name: Run affected product tests
        if: needs.changes.outputs.product_tests == 'true' && needs.changes.outputs.product_full != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
        run: |
          mapfile -t inputs < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              while IFS= read -r file; do
                case "$file" in
                  tests/unit/taskBoardGenerator.test.ts|tests/unit/aiCapabilities.test.ts)
                    continue
                    ;;
                  tests/e2e/*)
                    continue
                    ;;
                  .github/workflows/check-contracts.yml)
                    printf '%s\n' 'tests/unit/scopedValidationWorkflow.test.ts'
                    ;;
                  vendor/fonts/*/LICENSE)
                    printf '%s\n' 'tests/unit/bundledFonts.test.ts'
                    ;;
                  scripts/*.ts)
                    printf '%s\n' "$file"
                    printf '%s\n' 'tests/unit/nodeExportHostFontWiring.test.ts'
                    ;;
                  src/*|tests/*|scripts/*)
                    printf '%s\n' "$file"
                    ;;
                esac
              done
          )
          if (( ${#inputs[@]} == 0 )); then
            echo 'Selected product validation has no inputs' >&2
            exit 1
          fi
          xvfb-run --auto-servernum npx vitest related "${inputs[@]}" --run \
            --exclude=tests/unit/taskBoardGenerator.test.ts \
            --exclude=tests/unit/aiCapabilities.test.ts
      - run: npm run test:governance
        if: needs.changes.outputs.governance_tests == 'true'
      - run: npm run test:capabilities
        if: needs.changes.outputs.capability_check == 'true'

  # This additional required status must be configured by the independent
  # repository administrator. A mutable PR workflow alone cannot enforce trust.
  # The first installation has no baseline checker and explicitly stays unverified.
  trusted-core-validation:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require independently installed baseline checker
        shell: bash
        run: |
          if [[ ! -f trusted/scripts/check-core-experience-validation.ts ]]; then
            echo 'NI08 unverified: install the independently reviewed checker in the protected baseline' >&2
            exit 1
          fi
      - run: npm ci
        working-directory: trusted
      - name: Validate actual integration checkout with baseline obligations
        shell: bash
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          ln -s ../trusted/node_modules candidate/node_modules
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          trusted/node_modules/.bin/tsx trusted/scripts/check-core-experience-validation.ts \
            --trusted-root "$PWD/trusted" --candidate-root "$PWD/candidate" \
            --base-sha "$BASE_SHA" --candidate-sha "$candidate_sha" \
            --output "$PWD/validation-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trusted-core-validation-${{ github.run_id }}
          path: validation-report
          if-no-files-found: warn
