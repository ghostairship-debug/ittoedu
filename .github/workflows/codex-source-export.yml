name: Codex Source Export

on:
  push:
    branches:
      - codex/source-export-stabilization

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/ittoedu
          rsync -a \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'dist-electron/' \
            --exclude 'dist-player/' \
            --exclude 'release/' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            ./ export/ittoedu/
          rm -f export/ittoedu/.github/workflows/codex-source-export.yml
          printf '%s\n' '${{ github.sha }}' > export/ittoedu/SOURCE_SNAPSHOT_COMMIT.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ittoedu-source-snapshot
          path: export/ittoedu
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

# synchronized for dependency snapshot export
