<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水，带走一部分 · 杯中的小实验</title><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="water.css"><script src="water.config.js" defer></script><script src="water.js" defer></script></head>
<body class="water-page"><main class="water-lab" data-water-lab data-mode="extract">
  <div class="water-top"><p class="water-kicker" data-kicker>从材料，到液体 / A SMALL TRANSFER</p><button type="button" class="sound-toggle" data-sound aria-pressed="false" title="由程序合成的轻水声，仅在主动播放或加水时出现">水声 关</button></div>
  <div class="water-tabs" role="group" aria-label="观察阶段"><button type="button" data-mode-button="extract" aria-pressed="true">01　进入水</button><button type="button" data-mode-button="dilute" aria-pressed="false">02　水再多一点</button></div>
  <div class="water-grid"><figure class="water-figure"><canvas width="660" height="610" data-water-canvas role="img" aria-label="粉体中的部分物质进入水里；移走粉渣后，添加清水只改变杯中浓度"></canvas><figcaption data-figure-caption>点与颜色用于解释物质关系，大小、速度与色深均为示意。</figcaption></figure>
    <div class="water-response"><div data-extract-copy><span class="water-counter" data-step>01 / 浸润</span><h3 data-step-title>水先走近，<br>再带走一部分。</h3><p data-step-copy>水接触咖啡粉，部分可溶物进入液体。粉体仍然留在原处。</p><button class="water-action" type="button" data-replay>看水经过一次 →</button><button class="water-text-button" type="button" data-next>粉渣滤开以后，会怎样？ ↗</button></div>
    <div data-dilute-copy hidden><span class="water-counter" data-filtered-label>粉渣已经移开</span><h3 data-dilute-title>再加一点水，<br>什么没有变？</h3><div class="concentration"><output data-concentration>1.50</output><span>%</span><small data-concentration-label>杯中溶解物的质量分数</small></div><dl class="water-readings"><div><dt data-total-label>饮品总质量</dt><dd><output data-total>200</output><small>克</small></dd></div><div><dt data-solute-label>咖啡来源溶解物</dt><dd><output data-solute>3</output><small>克 · 不变</small></dd></div></dl><p class="water-response-copy" data-result>溶解物仍是 3 克。加入清水后，它分布在更多液体里。</p></div></div>
  </div>
  <div class="dilution-controls" data-controls hidden><div class="dilution-control-top"><label for="water-range">添加的清水 <output data-added>0</output> 克</label><div data-presets role="group" aria-label="选择加水量"><button type="button" data-add="0" aria-pressed="true">原杯</button><button type="button" data-add="50" aria-pressed="false">＋50 克</button><button type="button" data-add="100" aria-pressed="false">＋100 克</button></div></div><input id="water-range" type="range" min="0" max="100" value="0" step="1" aria-label="添加的清水克数"><div class="water-control-foot"><span>拖动比较不同加水量；向回拖动表示重设情形。</span><button type="button" data-reset>重置 ↺</button></div></div>
  <p class="water-assumption" data-assumption>设定：滤净的 200 克饮品含 3 克咖啡来源可溶物。清水不额外带入这类物质，忽略蒸发、洒出与反应。</p><p class="sr-only" data-water-live aria-live="polite"></p>
</main></body></html>
