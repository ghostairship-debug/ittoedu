<noscript><div class="nojs"><h3>日晒</h3><p>果皮、果肉和黏液仍在。种子留在果实里面，等干燥完成后，再去除外部组织。</p><h3>水洗</h3><p>先去皮和大部分果肉，再去除黏液。开始干燥时，种子通常仍被羊皮层包裹。</p><h3>蜜处理</h3><p>去皮、去掉大部分果肉后，保留不同程度的黏液，随羊皮层一起干燥。名字里的“蜜”，没有外加蜂蜜。</p></div></noscript></main>
