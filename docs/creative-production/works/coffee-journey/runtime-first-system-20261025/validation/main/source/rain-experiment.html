<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f0eee5;font-family:Arial,"Microsoft YaHei",sans-serif}body{padding:8px 0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #e8bb71;outline-offset:4px}.lab{padding:20px 22px;border:1px solid #48636a;border-radius:3px;background:#102830;min-height:1000px}.eyebrow{font-size:12px;letter-spacing:2px;color:#9bb6b9}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar button{background:transparent;border:1px solid #65838a;border-radius:2px;padding:10px 13px;color:#eae9df;font-size:14px}.toolbar button.active,.toolbar button:hover{background:#dcebc8;color:#102830;border-color:#dcebc8}.toolbar .rain{margin-left:auto;background:#d3a760;color:#152931;border-color:#d3a760}.districts{display:grid;gap:18px}.district{padding:20px 22px;background:#142f38;border:1px solid #37565f;min-height:337px}.district header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}.district h3{font-size:22px;font-weight:500;margin:0}.district .tag{font-size:12px;color:#9dbdc1;letter-spacing:1px}.city{position:relative;height:102px;overflow:hidden;border-bottom:1px solid #748e89;margin:0 0 17px;background:linear-gradient(180deg,#183d48,#16343e)}.blocks{position:absolute;bottom:28px;left:5%;width:55%;height:45px;background:repeating-linear-gradient(90deg,transparent 0 12%,#718185 12% 22%,transparent 22% 28%);opacity:.6}.road{position:absolute;height:15px;bottom:21px;left:0;background:#7b8a91;transition:width .22s}.garden{position:absolute;right:0;bottom:21px;height:15px;background:#aec799;transition:width .22s}.soil{position:absolute;left:0;right:0;bottom:0;height:21px;background:repeating-linear-gradient(9deg,#5c5e50 0 1px,#454d46 1px 7px)}.storage{position:absolute;bottom:3px;left:8%;height:12px;border:1px solid #57b9c0;transition:width .22s;background:#4099a2}.rainfield{position:absolute;inset:-45px 0 20px;pointer-events:none;opacity:0;background:repeating-linear-gradient(104deg,transparent 0 28px,#8ed1d88c 29px 30px,transparent 31px 67px);background-size:70px 80px}.playing .rainfield{animation:rain 2.4s linear forwards}@keyframes rain{0%{opacity:0;transform:translateY(-30px)}15%{opacity:.65}85%{opacity:.65}100%{opacity:0;transform:translateY(80px)}}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 12px}.metric span{font-size:12px;letter-spacing:1px;display:block}.metric strong{display:block;font-size:28px;font-weight:500;line-height:1.25;font-variant-numeric:tabular-nums}.i{color:#c3d6a7}.s{color:#76ccd0}.r{color:#e1b67c}.balance{display:flex;height:9px;overflow:hidden;background:#0a1c24;margin-bottom:18px}.balance i{display:block;transition:width .22s}.balance .i{background:#b7cd98}.balance .s{background:#56b2bb}.balance .r{background:#d5a463}.controls{display:grid;grid-template-columns:1fr 1fr;gap:24px}.controls label{display:block;font-size:14px;color:#d9e3de}.controls b{float:right;font-variant-numeric:tabular-nums;font-weight:400;color:#f5e0bc}.controls input{width:100%;margin:12px 0 0;accent-color:#b7cd98;cursor:pointer;touch-action:pan-y}.note{font-size:12px;line-height:1.6;color:#9bb4b8;margin:8px 0 0}.conclusion{display:flex;gap:24px;align-items:center;border-top:1px solid #44616a;margin-top:22px;padding-top:19px}.difference{font-size:40px;line-height:1;font-weight:400;color:#e5c491;font-variant-numeric:tabular-nums;white-space:nowrap}.difference small{font-size:13px}.explain{font-size:15px;line-height:1.65;margin:0;max-width:680px}.formula{font-size:12px;line-height:1.7;color:#8da9af;margin:18px 0 0}.presets-note{font-size:13px;color:#bad0cf;line-height:1.6;min-height:22px;margin:4px 0 16px}
@media(max-width:580px){.lab{padding:16px 14px;min-height:1016px}.toolbar{gap:7px}.toolbar button{font-size:12px;padding:9px 10px}.toolbar .rain{margin-left:0}.district{padding:17px 14px;min-height:328px}.district h3{font-size:19px}.district header{gap:4px}.district .tag{font-size:11px}.city{height:83px}.metrics{gap:8px}.metric strong{font-size:25px}.controls{gap:14px}.controls label{font-size:12px}.controls b{float:none;display:block;margin-top:4px}.controls input{margin-top:9px}.conclusion{gap:15px}.difference{font-size:32px}.explain{font-size:13px}.formula{font-size:11px}.presets-note{font-size:12px;min-height:38px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><section class="lab" aria-label="两街区雨水分配实验">
<div class="eyebrow">RAIN LAB / 100 UNITS</div><div class="toolbar"><button class="active" data-preset="renew">透水改造</button><button data-preset="storage">只增加蓄存</button><button class="rain" id="rain">让这场雨落下 ↓</button></div><p class="presets-note" id="preset-note">相同降雨，比较硬化街区与增加透水地面、蓄存空间后的街区。</p><div class="districts"></div>
<div class="conclusion"><div class="difference"><span id="difference">50</span><small> 单位</small></div><p class="explain" id="explain" aria-live="polite"></p></div>
<p class="formula">每条街区都收到100单位降雨。入渗 I = 60 × (1 − p)；暂存 S = min(c, 100 − I)；外排 R = 100 − I − S。颜色条合计100。地面与水箱图仅作示意，长度不是工程尺寸。</p></section>
<script>
(function(){
 const root=document.querySelector('.lab'),holder=document.querySelector('.districts');
 const state=[{p:.85,c:5},{p:.35,c:25}];let timer=0;
 holder.innerHTML=state.map((x,i)=>'<article class="district" data-district="'+i+'"><header><h3>街区 '+(i?'B':'A')+'</h3><span class="tag">'+(i?'改造的可能':'比较的起点')+'</span></header><div class="city" aria-hidden="true"><div class="blocks"></div><div class="road"></div><div class="garden"></div><div class="soil"></div><div class="storage"></div><div class="rainfield"></div></div><div class="metrics"><div class="metric i"><span>入渗 I</span><strong data-value="i"></strong></div><div class="metric s"><span>暂存 S</span><strong data-value="s"></strong></div><div class="metric r"><span>外排 R</span><strong data-value="r"></strong></div></div><div class="balance" aria-hidden="true"><i class="i"></i><i class="s"></i><i class="r"></i></div><div class="controls"><label>不透水比例 p <b data-p></b><input type="range" aria-label="街区'+(i?'B':'A')+'不透水比例" data-key="p" min="0" max="100" step="1" value="'+x.p*100+'"></label><label>蓄存能力 c <b data-c></b><input type="range" aria-label="街区'+(i?'B':'A')+'蓄存能力" data-key="c" min="0" max="40" step="1" value="'+x.c+'"></label></div></article>').join('');
 const format=n=>Number(n.toFixed(1)).toString();
 function calc(x){const i=60*(1-x.p),s=Math.min(x.c,100-i);return {i,s,r:100-i-s}}
 function draw(){const results=state.map(calc);state.forEach((x,k)=>{const card=holder.children[k],v=results[k];card.querySelector('[data-p]').textContent=Math.round(x.p*100)+'%';card.querySelector('[data-c]').textContent=x.c+' 单位';card.querySelector('.road').style.width=(x.p*100)+'%';card.querySelector('.garden').style.width=((1-x.p)*100)+'%';card.querySelector('.storage').style.width=(x.c*1.5)+'%';['i','s','r'].forEach(key=>{card.querySelector('[data-value="'+key+'"]').textContent=format(v[key]);card.querySelector('.balance .'+key).style.width=v[key]+'%'});card.dataset.total=format(v.i+v.s+v.r);card.dataset.runoff=format(v.r)});const delta=results[0].r-results[1].r;document.getElementById('difference').textContent=format(Math.abs(delta));document.getElementById('explain').textContent=delta===0?'两条街区外排相同。继续改变参数，观察相同外排是否对应相同的入渗和暂存。':'街区B比A'+(delta>0?'少':'多')+'外排'+format(Math.abs(delta))+'单位。'+(delta>0?'更多雨水留在了土壤或暂存空间；它并没有消失。':'观察地面与蓄存的共同影响，而不是只看一种设施。');root.dataset.state=JSON.stringify({a:{...state[0],...results[0]},b:{...state[1],...results[1]}})}
 holder.addEventListener('input',e=>{const key=e.target.dataset.key;if(!key)return;const k=+e.target.closest('.district').dataset.district;state[k][key]=+e.target.value/(key==='p'?100:1);document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('active'));document.getElementById('preset-note').textContent='自定义比较：每次只改一个变量，更容易看清它改变了哪一种去向。';draw()});
 document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{const values=b.dataset.preset==='renew'?[{p:.85,c:5},{p:.35,c:25}]:[{p:.8,c:5},{p:.8,c:35}];values.forEach((x,i)=>{Object.assign(state[i],x);holder.children[i].querySelector('[data-key="p"]').value=x.p*100;holder.children[i].querySelector('[data-key="c"]').value=x.c});document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('preset-note').textContent=b.dataset.preset==='renew'?'相同降雨，比较硬化街区与增加透水地面、蓄存空间后的街区。':'固定两边80%的不透水比例，只把B的蓄存从5提高到35。入渗不变，暂存增加，外排减少。';draw()}));
 function stop(){clearTimeout(timer);timer=0;root.classList.remove('playing');document.getElementById('rain').textContent='让这场雨落下 ↓'}
 document.getElementById('rain').addEventListener('click',()=>{stop();void root.offsetWidth;root.classList.add('playing');document.getElementById('rain').textContent='同一场雨 · 100单位';timer=setTimeout(stop,2450)});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
 const io=new IntersectionObserver(entries=>{if(!entries[0].isIntersecting)stop()});io.observe(root);
 window.addEventListener('pagehide',()=>{stop();io.disconnect()},{once:true});draw();
})();
</script></html>
